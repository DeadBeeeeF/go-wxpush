<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息通知</title>
    <style>
        :root {
            /* 浅色模式 - 清爽/护眼 */
            --bg-color: #f6f8fa;
            /* 极浅的灰蓝色 */
            --card-bg: #ffffff;
            --text-main: #24292e;
            /* 接近黑色的深灰 */
            --text-sub: #586069;
            --accent-color: #0969da;
            /* 科技蓝 */
            --sub-accent: #2da44e;
            /* 护眼绿 */
            --border-color: #e1e4e8;
            --code-bg: #f6f8fa;
            --shadow: 0 8px 24px rgba(140, 149, 159, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* 深色模式 - 柔和/不刺眼 */
                --bg-color: #0d1117;
                /* GitHub Dark Dimmed 风格 */
                --card-bg: #161b22;
                --text-main: #c9d1d9;
                --text-sub: #8b949e;
                --accent-color: #58a6ff;
                --sub-accent: #3fb950;
                --border-color: #30363d;
                --code-bg: #161b22;
                --shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 720px;
            animation: fadeIn 0.5s ease-out;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .card-header {
            padding: 24px 32px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(to right, rgba(9, 105, 218, 0.02), transparent);
        }

        .title {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .meta {
            font-size: 13px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .meta::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--sub-accent);
            border-radius: 50%;
        }

        .card-body {
            padding: 32px;
            font-size: 16px;
        }

        /* Content Styling */
        .content {
            color: var(--text-main);
        }

        .content h1,
        .content h2,
        .content h3 {
            margin-top: 1.5em;
            margin-bottom: 16px;
            font-weight: 600;
            line-height: 1.25;
        }

        .content h1 {
            font-size: 1.8em;
            padding-bottom: 0.3em;
            border-bottom: 1px solid var(--border-color);
        }

        .content h2 {
            font-size: 1.5em;
            padding-bottom: 0.3em;
        }

        .content p {
            margin-bottom: 16px;
        }

        .content a {
            color: var(--accent-color);
            text-decoration: none;
        }

        .content a:hover {
            text-decoration: underline;
        }

        .content blockquote {
            border-left: 4px solid var(--border-color);
            padding: 0 1em;
            color: var(--text-sub);
            margin-bottom: 16px;
        }

        .content ul,
        .content ol {
            padding-left: 2em;
            margin-bottom: 16px;
        }

        .content code {
            padding: 0.2em 0.4em;
            margin: 0;
            font-size: 85%;
            background-color: rgba(175, 184, 193, 0.2);
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
        }

        .content pre {
            padding: 16px;
            overflow: auto;
            font-size: 85%;
            line-height: 1.45;
            background-color: var(--bg-color);
            border-radius: 6px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .content pre code {
            background-color: transparent;
            padding: 0;
        }

        .content img {
            max-width: 100%;
            box-sizing: content-box;
            border-radius: 6px;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-sub);
            opacity: 0.6;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 16px 12px;
            }

            .card-header,
            .card-body {
                padding: 20px;
            }

            .title {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <div class="title">{{.Title}}</div>
                <div class="meta">{{.Date}}</div>
            </div>
            <div class="card-body">
                <div class="content markdown-body">
                    {{.Result}}
                </div>
            </div>
        </div>

        <div class="footer">
            Powered by Go-WxPush
        </div>
    </div>
</body>

</html>
