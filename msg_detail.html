<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息通知</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent-color: #0071e3;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 16px rgba(0, 0, 0, 0.08);
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px 16px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            margin-top: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 32px;
            margin-bottom: 24px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .card:hover {
            box-shadow: var(--shadow-md);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .header .meta {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .content {
            font-size: 16px;
            color: #333;
        }

        /* Markdown Styles */
        .content h1, .content h2, .content h3 { margin-top: 1.5em; margin-bottom: 0.5em; color: var(--text-primary); }
        .content h1 { font-size: 1.4em; border-bottom: 1px solid #eee; padding-bottom: 0.3em; }
        .content h2 { font-size: 1.25em; }
        .content p { margin-bottom: 1em; line-height: 1.7; }
        .content ul, .content ol { padding-left: 20px; margin-bottom: 1em; }
        .content li { margin-bottom: 0.25em; }
        .content code { 
            background-color: #f6f8fa; 
            padding: 0.2em 0.4em; 
            border-radius: 4px; 
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
            font-size: 85%;
            color: #d12f7b;
        }
        .content pre { 
            background-color: #f6f8fa; 
            padding: 16px; 
            border-radius: 8px; 
            overflow-x: auto; 
            margin-bottom: 1em; 
        }
        .content pre code { 
            background-color: transparent; 
            padding: 0; 
            color: #24292e; 
            font-size: 13px;
        }
        .content blockquote { 
            border-left: 4px solid #dfe2e5; 
            padding-left: 16px; 
            color: var(--text-secondary); 
            margin: 1em 0; 
        }
        .content a { color: var(--accent-color); text-decoration: none; }
        .content a:hover { text-decoration: underline; }
        .content img { max-width: 100%; border-radius: 8px; }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 40px;
        }

        @media (max-width: 480px) {
            .card { padding: 24px 20px; }
            .header h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>{{.Title}}</h1>
                <div class="meta">{{.Date}}</div>
            </div>
            
            <div class="content markdown-body">
                {{.Result}}
            </div>
        </div>
        
        <div class="footer">
            Powered by Go-WxPush
        </div>
    </div>
</body>
</html>
