version: '3.8'

services:
  go-wxpush:
    container_name: go-wxpush
    # Use the pre-built image from GitHub Container Registry
    image: ghcr.io/deadbeeeef/go-wxpush:latest
    # build: .  <-- Commented out to use remote image by default
    ports:
      - "5566:5566"
    restart: unless-stopped
    volumes:
      # Map config file for easier configuration
      - ./config.yml:/app/config.yml
      # Map timezone info to ensure correct time
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Shanghai
